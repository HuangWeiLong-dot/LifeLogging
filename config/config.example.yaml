# LifeLogging 全局配置
# 复制为 config/config.yaml 后修改。所有脚本都读这个文件，改这里不用改代码。
#
# 三个待定项（Apple Health / Linux 服务器 / AI 接入）全部在这里落地，
# 你答完直接改对应的值即可。

# ── 全局 ──────────────────────────────────────────────────
vault_path: "C:/path/to/LifeLogging/vault"
timezone: "Asia/Shanghai"
state_dir: "C:/path/to/LifeLogging/state"   # 台账、日志、中间产物

# 分类（顺序即日记/面板里的展示顺序）
# 所有记录一律英文。
# ⚠️ 改这里的名字，要同步改三处，否则会被判为「非标准分类」：
#      scripts/normalize.py 的 APP_RULES / TITLE_HINTS
#      scripts/generate_journal.py 的 SYSTEM_PROMPT
#      vault/99-Templates/ 里各面板的 CATEGORIES 数组
categories:
  - Work
  - Study
  - Life
  - Transport
  - Leisure
  - Health
  - Social
  - Other

# ── 时间黑洞 ──────────────────────────────────────────────
# 「黑洞」= 事后回想不起来、也不觉得值的那段时间（刷短视频、无目的逛站点）。
# 只在概览页出数字，不影响日记分类。
#
# 判定用的是**看得见的东西**：应用名 + 窗口标题里的关键词，小写子串匹配。
# 不用「时长超过 X 小时」这种纯时间规则 —— 一次 3 小时的专注时长更长，
# 但它恰恰是黑洞的反面。
#
# ⚠️ enabled: false 或者整节删掉，就一个都不标。面板会一直空着，
#    但这比标错好 —— 被冤枉的时间会直接显示在面板上。
# ⚠️ 关键词写得太宽会把正常时间也吃进去（"bilibili" 命中学习视频）。
#    宁可少写几个，看几天再补。
blackhole:
  enabled: false
  apps:                      # 命中应用名（子串）
    - "douyin"
    - "tiktok"
    - "weibo"
    - "xiaohongshu"
    - "kuaishou"
  sites:                     # 命中 URL（子串）—— 浏览器里的黑洞主要在站点上，
    - "douyin.com"           #   靠窗口标题是认不出来的（常常只剩「某文档 / New tab」）
    - "weibo.com"
    - "xiaohongshu.com"
    - "zhihu.com/hot"
  titles:                    # 命中窗口标题（子串）
    - "抖音"
    - "小红书"
    - "微博"
    - "recommend"            # 各种「猜你喜欢 / 推荐」
    - "shorts"
  min_minutes: 6             # 短于这个时长的块不算 —— 刷 30 秒手机算不上一次活动

# ── 采集层 ────────────────────────────────────────────────
sources:
  # ── 屏幕/麦克风录制 —— 已关闭 ──────────────────────────────
  # 明确不要录屏录音，所以整条链路关闭。
  #
  # 关掉之后失去的：音频转录、会议记录、屏幕全文 OCR。
  # 保留下来的：ActivityWatch 的窗口标题。它本身信息量不小 ——
  #   直接告诉你在哪个文档 / 哪个页面 / 哪个文件上，
  #   足以支撑「工作/学习/休闲」这类判断和「这段时间在干嘛」的描述。
  #
  # 如将来要重新开启，把 enabled 改回 true 即可，代码还在。
  # 另注意：screenpipe 是 source-available 不是开源，个人自用免费但不能商用。
  screenpipe:
    enabled: false
    db_path: "C:/Users/<you>/.screenpipe/db.sqlite"
    api_base: "http://127.0.0.1:3030"
    api_bearer: ""

  # ── 窗口 / AFK —— 主力数据源 ───────────────────────────────
  activitywatch:
    enabled: true
    api_base: "http://127.0.0.1:5600"
    # ★ 强烈建议装浏览器扩展 aw-watcher-web（开源，不录屏不截图）。
    #   它上报 URL 和页面标题，比只靠窗口标题信息量大得多 ——
    #   这是在「不录制」前提下提升日记质量最划算的一步。
    #   安装：https://docs.activitywatch.net/en/latest/watchers.html
    #   装完会在 buckets 里多出 aw-watcher-web-* 桶。

  # Linux 服务器
  dawarich:
    enabled: true
    api_base: "http://REPLACE_WITH_SERVER:3000"
    api_key: "REPLACE_ME"
    # 若服务器无公网、走 Tailscale，这里填 Tailscale 内网地址即可

  # 本机中间件（统一事件表）
  events_api:
    enabled: true
    # ⚠️ 端口留在 15000 以上，别用 8787 这类低位端口。
    #    1024–15000 是 Windows 动态端口池，Hyper-V / WSL 每次开机都会从里面
    #    划走几段保留，你的服务就会 bind 失败（WinError 10013）——
    #    而采集脚本会把「连不上事件表」当降级处理、照样报成功，数据静默丢失。
    #    查当前保留段：netsh int ipv4 show excludedportrange protocol=tcp
    api_base: "http://127.0.0.1:18787"
    api_key: "REPLACE_ME"

  # Gadgetbridge 导出的 SQLite（手环数据）
  gadgetbridge:
    enabled: false            # 没有手环就设 false
    db_path: "C:/Users/<you>/gadgetbridge-export/gadgetbridge.db"  # 手机导出后同步过来

  # ── 手机使用事件的中继（跑在 Linux 服务器上）──────────────────
  #
  # 链路：手机 ──随时──> 服务器中继 ──笔记本醒着时──> collect_phone_events.py
  #
  # ⚠️ 手机**不能**直接发给笔记本：笔记本一天只醒几小时（实测 24 小时里
  #    只醒 3.4 小时），而 Tasker 的 HTTP 请求**没有队列** —— 电脑睡着时
  #    那一发就直接失败，数据静默丢失。服务器 24 小时开着，所以让手机只对
  #    它说话。跟位置数据（Dawarich）是同一套形状。
  #
  # ⚠️ 每日提问也走这个中继（见下面的 questions 段）。
  #    部署：server/phone-relay/README.md
  phone_relay:
    enabled: false                              # 中继部署好再改 true
    api_base: "http://REPLACE_WITH_SERVER:8788" # 填服务器的 Tailscale 内网地址
    api_key: "REPLACE_ME"                       # /etc/lifelogging/relay.env 里那把

  # Apple Health —— 纯 Android 的话整块设 false，iOS 链路不再需要
  apple_health:
    enabled: false
    ingest_url: "http://127.0.0.1:18787/ingest/apple-health"
    # 启用时：iPhone 装 Health Auto Export，Automations → REST API
    # 指向上面 ingest_url，加 Bearer header = events_api.api_key

# ── 理解层 ────────────────────────────────────────────────
ai:
  # deepseek    = DeepSeek API（推荐：成本极低，中英文都好，OpenAI 兼容协议）
  # anthropic   = Anthropic API
  # claude_code = 复用 Claude Code 订阅，走 `claude -p --output-format json`
  # ollama      = 本地零成本
  provider: "deepseek"

  # ── DeepSeek ────────────────────────────────────────────────
  deepseek_base: "https://api.deepseek.com"
  deepseek_model: "deepseek-flash"
  deepseek_api_key_env: "DEEPSEEK_API_KEY"

  # ── 精确账单（可选，但强烈建议配）────────────────────────────
  # 上面那把 API key 只能查余额，**查不到按天按模型的用量**。
  # 想拿到和官网「用量」页一模一样的数字，得用**登录态 userToken**
  # （platform.deepseek.com → F12 → Application → Local Storage → userToken
  #   → 复制 value 字段那个字符串）。见 scripts/collect_ai_usage.py 的文件头。
  #
  # ⚠️ 它是登录凭证，等于你的账号：别提交进 git、别贴进聊天记录。
  #    和 API key 一样只存环境变量，这里只写变量名。
  #       setx DEEPSEEK_USER_TOKEN "..."
  # ⚠️ 会过期（重新登录就换）。过期后 collect_ai_usage.py 会报 401 让你重拷。
  deepseek_user_token_env: "DEEPSEEK_USER_TOKEN"
  # deepseek-flash     快、极便宜。日记生成够用，先从这个开始
  # deepseek-v4-pro    贵约 3 倍，写作质量更高。不满意 Flash 的输出再换
  #
  # 缓存是**自动的**（磁盘前缀缓存），不需要 cache_control 标记。
  # 前缀 ≥1024 token 且逐字节匹配就自动命中，命中价约为未命中的 1/50。
  # 所以：系统提示词越长越稳定越省钱，千万不要把日期拼进 system 里。

  # ── Anthropic（备用）────────────────────────────────────────
  model: "claude-sonnet-5-5"
  api_key_env: "ANTHROPIC_API_KEY"

  # ⚠️ 这是**推理 token + 正文**共用的额度，不是正文的额度。
  #    实测：输出整 8,000 token 里有 7,915 是推理，正文只剩几十个 token 就撞顶，
  #    日记被拦腰截断。推理量在不同天能差一个数量级，估不出「够用的数」——
  #    所以既要留足余量（这里），又要检测截断（common.TruncatedOutput）。
  max_output_tokens: 16000
  temperature: 0.3

  # ── 本地 ────────────────────────────────────────────────────
  ollama_base: "http://127.0.0.1:11434"
  ollama_model: "qwen2.5:14b"

# 价格表（每百万 token，CNY）
#
# ⚠️ 这是**本地估算**，不是账单。DeepSeek 的官方价会在控制台公告，
#    数字变了请更新这里，否则预算控制会失真。
#    核对命令：python scripts/cost_guard.py check-deepseek
#
# 峰谷计费：北京时间周一至周五 09:00-12:00 与 14:00-18:00 为 peak，
#          其余（含周末）为 off_peak，价格是 peak 的一半。
#          每晚 23:00 跑流水线正好落在 off_peak —— 直接省一半。
#
# 账户以人民币结算，所以这里用 CNY。改币种要连 budget.currency 一起改。
pricing:
  _currency: "CNY"

  "deepseek-flash":
    currency: "CNY"
    cache_hit:  {peak: 0.04, off_peak: 0.02}
    cache_miss: {peak: 2.00, off_peak: 1.00}
    output:     {peak: 8.00, off_peak: 4.00}

  "deepseek-v4-pro":
    currency: "CNY"
    cache_hit:  {peak: 0.30, off_peak: 0.15}
    cache_miss: {peak: 9.00, off_peak: 4.50}
    output:     {peak: 27.00, off_peak: 13.50}

  "claude-sonnet-5-5":
    currency: "USD"
    cache_hit: 0.30
    cache_miss: 3.00
    output: 15.00

# ── 每日提问（可选）─────────────────────────────────────────────
#
# 日记写完之后，再从里面提炼几条**只能用「做了 / 没做」回答**的问题，
# 推到服务器中继上；手机早上轮询到了就弹通知，点开是个表单。
#
# 问题大头是**拿昨天你自己写的话堵今天** —— 日记里的
# `### Adjustments for Tomorrow` 和挂在任务表上的 `[ ]` 就是素材。
# 生成见 scripts/generate_questions.py，回写见 scripts/apply_answers.py。
#
# 链路：
#   generate_questions.py ──> 中继 /questions ──> 手机表单
#        ──> /answer ──> 事件表 ──> apply_answers.py 回写 04-Tasks/Tasks.md
#
# ⚠️ 它复用 sources.phone_relay 的连接信息，中继那边要一起部署新路由。
#    部署步骤见 server/phone-relay/README.md 和 docs/运维手册.md。
questions:
  enabled: false        # 中继部署好、Tasker 配好之后再改 true
  # 两类分开配额，都要。「问责」拿你自己写的话堵你；「常规」问数据看不见的维度。
  commitment: 7         # 问责类：昨天的承诺 / 挂着的任务 / 数据自相矛盾处
  routine: 5            # 常规类：精力、睡眠、专注、身体、社交……只有你知道的那些
  language: "zh"        # 问题正文用什么语言；证据是原文照抄，不翻译
  push: true            # 生成后推到中继；false 就只留在本机 state/ 下
  max_age_days: 2       # 只对最近 N 天提问 —— 补跑历史时不生成过期问题

# ── 成本控制 ──────────────────────────────────────────────
budget:
  # ⚠️ 单位跟随 pricing 的币种（当前 CNY）。
  #    字段名里不带 _usd 是有意的 —— 「叫 USD 却装人民币」是埋雷。
  currency: "CNY"
  daily_cap: 3.00            # 每日硬上限（CNY）
  warn_pct: 0.80             # 到达 80% 时告警
  fail_closed: true          # true = 超限直接中止；false = 只告警继续跑
  ledger_path: "C:/path/to/LifeLogging/state/cost_ledger.jsonl"
  max_llm_calls_per_run: 8   # 单次流水线最多调用几次 LLM（防跑飞）

  # 接近上限时降级到哪个模型。deepseek-flash 已经是最便宜的档位，
  # 所以默认留空（不降级）。填 ollama 之类的本地模型才有意义。
  fallback_model: ""

# ── 厂商账单对账（需要 Admin key，普通 API key 无效）──────
reconcile:
  enabled: false
  anthropic_admin_key_env: "ANTHROPIC_ADMIN_KEY"   # sk-ant-admin01-...
  delta_warn_pct: 0.05       # 本地估算与厂商账单差异超 5% 告警

# ── 可选的 LiteLLM 网关（要硬预算封顶才需要）─────────────
litellm:
  enabled: false
  base_url: "http://REPLACE_WITH_SERVER:4000"
  master_key_env: "LITELLM_MASTER_KEY"
  # ⚠️ LiteLLM 的 max_budget 在没有 Postgres 时是 fail-open（静默放行超额）
  #    要真正硬封顶必须接 database_url，见 docker/litellm/

# ── 反向地理编码（本地离线，不联网）────────────────────────────
# Dawarich 自带的默认关闭，开启需要配托管 provider（坐标会发给第三方）。
# 这里用本地的 GeoNames 城市表，全程离线。
#
# 精度档位（越大越细，文件也越大）：
#   cities1000   人口>1000   到区/县        17 万条   32 MB
#   cities500    人口>500    到街道/镇      24 万条   42 MB  <- 当前
#   allCountries 全部居民点   到小区(PPLX)   千万级    GB 级，需另建索引
geocoding:
  dataset: "cities500"
  enabled: true

# ── 发布到个人站点（liveinpassion.me/life，可选）─────────────────
# 每晚把近 N 天的**脱敏聚合**（分类时长、步数、城市级位置、手机计数、
# AI 花费）POST 给站点 Worker。不发送坐标、轨迹、窗口标题/URL、包名、余额。
#
# token 只放环境变量，不写在这里：
#   setx LIFE_INGEST_TOKEN "<与 Cloudflare Worker secret 相同的值>"
life_site:
  enabled: false
  ingest_url: "https://cms.liveinpassion.me/api/life/ingest"
  raw_ingest_url: "https://cms.liveinpassion.me/api/life/raw/ingest"
  token_env: "LIFE_INGEST_TOKEN"
  days: 30
  chunk_size: 14
