# 課表模板 —— 复制成 config/timetable.yaml 再改。
#
# 这里写的是「本来应该发生什么」，不是「实际发生了什么」。它是**预期**，
# `scripts/routine.py` 拿它和实际数据比，算出**偏离**。
#
# 字段：
#   start / end   24 小时制 "HH:MM"
#   what          这段在干什么（会原样出现在追问卡片里）
#   kind          决定了「符合预期」怎么判，见下方对照表
#   place         可选。已知地名（和 Dawarich 反查出来的写法一致，比如
#                 "Zhabei, Shanghai, CN"）；填了就会额外比对位置
#
# kind 对照表（scripts/routine.py 的 KIND_TO_CATEGORY）：
#   课 / 自习 / 学习  -> Study      工作 / 兼职 -> Work
#   运动              -> Health     吃饭        -> Life
#   社交              -> Social     通勤        -> Transport
#   休息              -> Leisure    自由        -> 不判偏离
#
# ⚠️ 没写的时段 = 自由时间，不判偏离。宁可少判，也不要冤枉人。
# ⚠️ 笔记本来没开的时候是「没观测到」，不是「偏离」—— routine.py 会分开算。

