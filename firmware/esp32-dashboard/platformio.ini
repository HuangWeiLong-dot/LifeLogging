; 吹雪 ESP32-S3-Touch-LCD-3.5-C
; = 微雪 ESP32-S3-Touch-LCD-3.5 的带壳版本（ESP32-S3R8 / 16MB Flash / 8MB OPI PSRAM）
; 屏幕 ST7796 (SPI) 320x480，触摸 FT6336 (I2C 0x38)
; 引脚取自官方 BSP: examples/factory/components/esp32_s3_touch_lcd_3_5/include/bsp/

[platformio]
default_envs = dashboard

[env]
; 用项目内的精简 platform 定义：跳过 riscv32 工具链(653MB)和两套 GDB(~400MB)。
; 见 platform-slim/platform.py 末尾的定制段。上游是 espressif32 8.0.0。
platform = file://platform-slim
board = esp32-s3-devkitc-1
framework = arduino

upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3R8：16MB quad flash + 8MB octal(OPI) PSRAM
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  moononournation/GFX Library for Arduino@^1.5.3
  bblanchon/ArduinoJson@^7.2.0
  lewisxhe/XPowersLib@^0.2.7

; ── 正式看板 ───────────────────────────────────────────
[env:dashboard]
build_src_filter = +<*> -<probe.cpp>
build_flags = ${env.build_flags} -DDASHBOARD

; ── 硬件自检（点亮屏幕 / 扫 I2C / 读触摸）──────────────
[env:probe]
; 只编探针本身：不拉 ui/net，硬件没验证前不引入无关的编译失败
build_src_filter = +<probe.cpp> +<power.cpp>
build_flags = ${env.build_flags} -DPROBE
